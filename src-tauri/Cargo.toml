[package]
name = "json-workbench"
version = "0.1.2"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
rfd = "0.15"
sha2 = "0.10"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
